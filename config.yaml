api:
  base_url: http://blacksmith.local
  default_page_size: 10
auth:
  issuer: http://127.0.0.1:4444/
  jwks_url: http://127.0.0.1:4444/.well-known/jwks.json
  scope_claim: scp
database:
  url: postgresql+asyncpg://postgres:postgres@0.0.0.0:5432/postgres
  pool_size: 10
  pool_recycle: 30
audit:
  enabled: true
  exclude_paths:
    - /api/v1/health
