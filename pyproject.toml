[project]
name = "python-model"
version = "0.0.1"
maintainers = [
  {name = "John Doe", email = "john.doe@example.com"}
]
keywords = ["sample"]
description = "Sample project for Python"
readme = "README.md"
requires-python = ">=3.15.2"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.115.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.32.0",
]

# Ruff linter configuration
# https://docs.astral.sh/ruff/linter/
[tool.ruff.lint]

# https://docs.astral.sh/ruff/settings/#lint_ignore
ignore = [
  "TC001", # https://docs.astral.sh/ruff/rules/typing-only-first-party-import/
]

# https://docs.astral.sh/ruff/settings/#lint_select
select = [
  "FAST",    # FastAPI: https://docs.astral.sh/ruff/rules/?linter=fastapi-fast
  "I",       # isort: https://docs.astral.sh/ruff/rules/?linter=isort-i
  "F",       # pyflakes: https://docs.astral.sh/ruff/rules/#pyflakes-f
  "E", "W",  # pycodestyle: https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
  "N",       # pep8-naming: https://docs.astral.sh/ruff/rules/#pep8-naming-n
  "UP",      # pyupgrade: https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "ANN",     # flake8-annotations: https://docs.astral.sh/ruff/rules/?linter=flake8-annotations-ann
  "ASYNC",   # flake8-async: https://docs.astral.sh/ruff/rules/?linter=flake8-async-async
  "B",       # flake8-bugbear: https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "A",       # flake8-builtins: https://docs.astral.sh/ruff/rules/#flake8-builtins-a
  "DTZ",     # flake8-datetimez: https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
  "T10",     # flake8-debugger: https://docs.astral.sh/ruff/rules/#flake8-debugger-t10
  "ISC",     # flake8-implicit-str-concat: https://docs.astral.sh/ruff/rules/#flake8-implicit-str-concat-isc
  "INP",     # flake8-no-pep420: https://docs.astral.sh/ruff/rules/#flake8-no-pep420-inp
  "T20",     # flake8-print: https://docs.astral.sh/ruff/rules/#flake8-print-t20
  "PYI",     # flake8-pyi: https://docs.astral.sh/ruff/rules/?linter=flake8-pyi-pyi
  "PT",      # flake8-pytest-style: https://docs.astral.sh/ruff/rules/?linter=flake8-pytest-style-pt
  "RSE",     # flake8-raise: https://docs.astral.sh/ruff/rules/?linter=flake8-raise-rse
  "RET",     # flake8-return: https://docs.astral.sh/ruff/rules/?linter=flake8-return-ret
  "SLF",     # flake8-self: https://docs.astral.sh/ruff/rules/?linter=flake8-self-slf
  "SIM",     # flake8-simplify: https://docs.astral.sh/ruff/rules/?linter=flake8-simplify-sim
  "TC",      # flake8-type-checking: https://docs.astral.sh/ruff/rules/?linter=flake8-type-checking-tc
  "ARG",     # flake8-unused-arguments: https://docs.astral.sh/ruff/rules/?linter=flake8-unused-arguments-arg
  "FLY",     # flynt: https://docs.astral.sh/ruff/rules/#flynt-fly
  "FURB",    # refurb: https://docs.astral.sh/ruff/rules/?linter=refurb-furb
  "RUF",     # Ruff: https://docs.astral.sh/ruff/rules/?linter=ruff-specific-rules-ruf
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.8.5",
    "ruff==0.17.4",
    "ty>=0.0.96",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest]
addopts = [
  "--cov=app",
]
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"

[tool.pytest_env]
CONFIG_FILE_PATH="tests/config.yaml"

[tool.alembic]

# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = "%(here)s/app/adapters/database/migrations"

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
# Or organize into date-based subdirectories (requires recursive_version_locations = true)
# file_template = "%%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s"

# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = [
    "."
]

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the tzdata library which can be installed by adding
# `alembic[tz]` to the pip requirements.
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# version_locations = [
#    "%(here)s/alembic/versions",
#    "%(here)s/foo/bar"
# ]


# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = "utf-8"

# This section defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples
# [[tool.alembic.post_write_hooks]]
# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# name = "black"
# type = "console_scripts"
# entrypoint = "black"
# options = "-l 79 REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# lint with attempts to fix using "ruff" - use the module runner, against the "ruff" module
# name = "ruff"
# type = "module"
# module = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# Alternatively, use the exec runner to execute a binary found on your PATH
# name = "ruff"
# type = "exec"
# executable = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"

